<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letras Cast</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: sans-serif; background-color: #121212; color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
        #setup { display: flex; flex-direction: column; flex-grow: 1; gap: 10px; }
        textarea { flex-grow: 1; padding: 15px; border-radius: 8px; border: none; font-size: 16px; background-color: #1e1e1e; color: white; resize: none; }
        .controls-setup { display: flex; gap: 10px; }
        button { padding: 15px; background-color: #007bff; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; flex: 1; }
        .btn-secondary { background-color: #444; }
        .btn-danger { background-color: #d9534f; }
        #presentation { display: none; flex-direction: column; justify-content: center; align-items: center; height: 100vh; position: absolute; top: 0; left: 0; width: 100%; background-color: black; text-align: center; padding: 40px; box-sizing: border-box; }
        #slideText { font-size: 5vh; font-weight: bold; line-height: 1.3; }
        .close-btn { position: absolute; top: 20px; right: 20px; background-color: #333; padding: 10px 20px; font-size: 14px; }
    </style>
</head>
<body>

    <div id="setup">
        <h2>Letras Cast</h2>
        <input type="text" id="searchQuery" placeholder="Artista - Música (Busca rápida)" style="padding: 15px; border-radius: 8px; border: none; font-size: 16px;">
        <button onclick="searchLyrics()">Buscar Online</button>
        <textarea id="lyricsInput" placeholder="Cole a letra aqui ou use o botão abaixo..."></textarea>
        <div class="controls-setup">
            <button class="btn-secondary" onclick="pasteLyrics()">Colar</button>
            <button class="btn-danger" onclick="clearLyrics()">Apagar</button>
        </div>
        <button onclick="startPresentation()">Iniciar Apresentação</button>
    </div>

    <div id="presentation">
        <button class="close-btn" onclick="exitPresentation()">Sair</button>
        <div id="slideText"></div>
    </div>

    <script>
        let slides = [];
        let currentSlide = 0;

        async function searchLyrics() {
            const query = document.getElementById('searchQuery').value;
            if (!query) return alert('Digite Artista - Música');
            const [artist, title] = query.split('-').map(s => s.trim());
            
            try {
                const response = await fetch(`https://api.lyrics.ovh/v1/${artist}/${title}`);
                const data = await response.json();
                if (data.lyrics) {
                    document.getElementById('lyricsInput').value = data.lyrics;
                } else {
                    alert('Letra não encontrada via busca. Cole manualmente!');
                }
            } catch (e) {
                alert('Erro na busca. Cole manualmente!');
            }
        }

        async function pasteLyrics() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('lyricsInput').value = text;
            } catch (err) {
                alert('Permissão de colagem negada.');
            }
        }

        function clearLyrics() {
            document.getElementById('lyricsInput').value = '';
        }

        function startPresentation() {
            const text = document.getElementById('lyricsInput').value;
            slides = text.split(/\n\s*\n/).filter(s => s.trim() !== '');
            if (slides.length === 0) return alert('Cole uma letra primeiro!');
            
            currentSlide = 0;
            document.getElementById('setup').style.display = 'none';
            document.getElementById('presentation').style.display = 'flex';
            updateSlide();
            
            if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
        }

        function updateSlide() {
            document.getElementById('slideText').innerText = slides[currentSlide];
        }

        document.addEventListener('keydown', (event) => {
            if (document.getElementById('presentation').style.display === 'flex') {
                if (event.key === 'ArrowRight') nextSlide();
                if (event.key === 'ArrowLeft') prevSlide();
            }
        });

        function nextSlide() {
            if (currentSlide < slides.length - 1) { currentSlide++; updateSlide(); }
        }

        function prevSlide() {
            if (currentSlide > 0) { currentSlide--; updateSlide(); }
        }

        function exitPresentation() {
            document.getElementById('presentation').style.display = 'none';
            document.getElementById('setup').style.display = 'flex';
            if (document.fullscreenElement) document.exitFullscreen();
        }

        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
    </script>
</body>
</html>
