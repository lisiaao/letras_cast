<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letras Cast</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: sans-serif; background-color: #121212; color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
        #setup { display: flex; flex-direction: column; flex-grow: 1; gap: 15px; }
        textarea { flex-grow: 1; padding: 15px; border-radius: 8px; border: none; font-size: 16px; background-color: #1e1e1e; color: white; resize: none; }
        .controls-setup { display: flex; gap: 15px; }
        button { padding: 15px; background-color: #007bff; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; flex: 1; z-index: 10; }
        .btn-secondary { background-color: #444; }
        .btn-danger { background-color: #d9534f; }
        
        /* Estilos da tela de apresentação */
        #presentation { display: none; flex-direction: column; justify-content: center; align-items: center; height: 100vh; position: absolute; top: 0; left: 0; width: 100%; background-color: black; text-align: center; padding: 40px; box-sizing: border-box; cursor: pointer; user-select: none; }
        #slideText { font-size: 5vh; font-weight: bold; line-height: 1.3; transition: font-size 0.2s; pointer-events: none; }
        
        /* Estilos do Menu de 3 pontinhos */
        .menu-container { position: absolute; top: 20px; right: 20px; z-index: 100; }
        .menu-btn { background-color: transparent; color: white; border: none; border-radius: 50%; width: 50px; height: 50px; font-size: 28px; display: flex; justify-content: center; align-items: center; padding: 0; flex: none; transition: background 0.3s; }
        .menu-btn:hover { background-color: rgba(255, 255, 255, 0.1); }
        .dropdown-content { display: none; position: absolute; right: 0; top: 60px; background-color: #222; min-width: 240px; border-radius: 12px; box-shadow: 0px 10px 30px rgba(0,0,0,0.8); overflow: hidden; flex-direction: column; }
        .dropdown-content.show { display: flex; }
        .menu-item { background: none; color: white; padding: 20px; text-align: left; border: none; width: 100%; font-size: 16px; cursor: pointer; border-radius: 0; flex: none; font-weight: normal; border-bottom: 1px solid #333; }
        .menu-item:last-child { border-bottom: none; }
        .menu-item:hover { background-color: #383838; }
        .danger-text { color: #ff4d4d; font-weight: bold; }
    </style>
</head>
<body>

    <div id="setup">
        <h2>Letras Cast</h2>
        
        <div class="controls-setup">
            <button class="btn-secondary" onclick="pasteLyrics()">Colar Letra</button>
            <button class="btn-danger" onclick="clearLyrics()">Apagar</button>
        </div>
        
        <textarea id="lyricsInput" placeholder="Cole a letra aqui (pule linhas para separar os slides)..."></textarea>
        <button onclick="startPresentation()">Iniciar Apresentação</button>
    </div>

    <div id="presentation">
        <div class="menu-container">
            <button class="menu-btn" onclick="toggleMenu(event)">&#8942;</button>
            <div id="presentationMenu" class="dropdown-content">
                <button class="menu-item" onclick="zoomIn(event)">Aumentar Letra (A+)</button>
                <button class="menu-item" onclick="zoomOut(event)">Diminuir Letra (A-)</button>
                <button class="menu-item danger-text" onclick="exitPresentation(event)">Sair da Apresentação</button>
            </div>
        </div>
        <div id="slideText"></div>
    </div>

    <script>
        let slides = [];
        let currentSlide = 0;
        let currentFontSize = 5;

        async function pasteLyrics() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('lyricsInput').value = text;
            } catch (err) {
                alert('Para colar, toque e segure na caixa de texto e escolha "Colar".');
            }
        }

        function clearLyrics() {
            document.getElementById('lyricsInput').value = '';
        }

        function startPresentation() {
            const text = document.getElementById('lyricsInput').value;
            slides = text.split(/\n\s*\n/).filter(s => s.trim() !== '');
            if (slides.length === 0) return alert('Cole uma letra primeiro!');
            
            currentSlide = 0;
            currentFontSize = 5; 
            document.getElementById('slideText').style.fontSize = currentFontSize + 'vh';
            
            document.getElementById('setup').style.display = 'none';
            document.getElementById('presentation').style.display = 'flex';
            updateSlide();
            
            if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
        }

        function updateSlide() {
            document.getElementById('slideText').innerText = slides[currentSlide];
        }

        function toggleMenu(event) {
            event.stopPropagation();
            document.getElementById("presentationMenu").classList.toggle("show");
        }

        function zoomIn(event) { if(event) event.stopPropagation(); currentFontSize += 0.5; document.getElementById('slideText').style.fontSize = currentFontSize + 'vh'; }
        function zoomOut(event) { if(event) event.stopPropagation(); if (currentFontSize > 2) { currentFontSize -= 0.5; document.getElementById('slideText').style.fontSize = currentFontSize + 'vh'; } }
        
        function exitPresentation(event) {
            if(event) event.stopPropagation();
            document.getElementById('presentation').style.display = 'none';
            document.getElementById('setup').style.display = 'flex';
            document.getElementById("presentationMenu").classList.remove("show");
            if (document.fullscreenElement) document.exitFullscreen();
        }

        document.getElementById('presentation').addEventListener('click', function(event) {
            const menu = document.getElementById("presentationMenu");
            
            if (menu.classList.contains('show') && !event.target.closest('.menu-container')) {
                menu.classList.remove('show');
                return; 
            }

            if (event.target.closest('.menu-container')) return;

            event.clientX > window.innerWidth / 2 ? nextSlide() : prevSlide();
        });

        document.addEventListener('keydown', (event) => {
            if (document.getElementById('presentation').style.display === 'flex') {
                if (event.key === 'ArrowRight') nextSlide();
                if (event.key === 'ArrowLeft') prevSlide();
                if (event.key === '+' || event.key === '=') zoomIn();
                if (event.key === '-') zoomOut();
            }
        });

        function nextSlide() { if (currentSlide < slides.length - 1) { currentSlide++; updateSlide(); } }
        function prevSlide() { if (currentSlide > 0) { currentSlide--; updateSlide(); } }

        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
    </script>
</body>
</html>
